name: java-main-ci
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Set up JDK 17
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"         
      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69 # v1
        with:
          token_format: 'access_token'
          workload_identity_provider: projects/144266375356/locations/global/workloadIdentityPools/scs-pool/providers/gh-provider
          service_account: artifacts-scs-ro@cognite-inso-internal.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b # v1
      - name: Verify with Maven
        run: mvn --update-snapshots --batch-mode verify -Prelease-internal